<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="240" height="240" rx="56" fill="#7C3AED"/><svg x="43.940298507462686" y="40" width="168.11940298507463" height="176" viewBox="56 52 128 134" fill="#FFFFFF">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="i1_nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd34fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#41d1ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="i1_lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd34fe;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#41d1ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Connection Lines -->
  <g class="connections">
    <path d="M120 80L80 120" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M120 80L160 120" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M80 120L120 160" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M160 120L120 160" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M80 120L160 120" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Nodes -->
  <g class="nodes">
    <!-- Central Node -->
    <circle cx="120" cy="80" r="20"/>
    <circle cx="120" cy="80" r="24" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    
    <!-- Left Node -->
    <circle cx="80" cy="120" r="16"/>
    <circle cx="80" cy="120" r="20" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    
    <!-- Right Node -->
    <circle cx="160" cy="120" r="16"/>
    <circle cx="160" cy="120" r="20" stroke="#FFFFFF" stroke-width="1" fill="none"/>
    
    <!-- Bottom Node -->
    <circle cx="120" cy="160" r="18"/>
    <circle cx="120" cy="160" r="22" stroke="#FFFFFF" stroke-width="1" fill="none"/>
  </g>

  <!-- Pulse Animation -->
  
</svg></svg>
